<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="한국과 미국의 주요 뉴스 30개를 매시간 한국어로 요약해 제공합니다.">
<title>한미 헤드라인 - 최신 뉴스 30</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f7fb;color:#222;font-family:Arial,"Noto Sans KR",sans-serif}
.container{max-width:1100px;margin:0 auto;padding:34px 16px 50px}
header{text-align:center;margin-bottom:24px}
h1{margin:0 0 8px;font-size:30px}
.subtitle{color:#666;margin:0}
h2{margin-top:0}
footer{text-align:center;color:#888;font-size:13px;margin-top:25px}
.news-section{margin-top:28px}
.news-header{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:14px}
.news-header h2{margin:0 0 5px}.news-header p{margin:0;color:#666}
.updated-at{font-size:13px;color:#777;white-space:nowrap}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.filter-btn{border:1px solid #d7dce5;background:#fff;border-radius:999px;padding:8px 13px;cursor:pointer;font-weight:700;color:#555}
.filter-btn.active{background:#222;color:#fff;border-color:#222}
.news-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.news-item{display:flex;flex-direction:column;min-height:180px;background:#fff;border-radius:14px;padding:18px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.news-meta{display:flex;flex-wrap:wrap;gap:7px;align-items:center;font-size:12px;color:#777;margin-bottom:10px}
.badge{padding:3px 7px;border-radius:999px;background:#eef2f8;color:#40506a;font-weight:700}
.news-item h3{font-size:17px;line-height:1.45;margin:0 0 8px}
.news-summary{font-size:14px;line-height:1.6;color:#555;margin:0 0 14px}
.news-link{margin-top:auto;color:#2457c5;text-decoration:none;font-size:14px;font-weight:700}
.news-state{grid-column:1/-1;text-align:center;padding:36px 15px;background:#fff;border-radius:14px;color:#777}
@media(max-width:600px){h1{font-size:25px}}
@media(max-width:600px){.news-header{display:block}.updated-at{display:block;margin-top:8px}.news-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container">
<header>
<h1>한미 헤드라인</h1>
<p class="subtitle">한국과 미국의 중요한 뉴스를 매시간 한국어로 정리합니다.</p>
</header>

<section class="news-section" aria-labelledby="news-title">
<div class="news-header">
<div>
<h2 id="news-title">한국·미국 주요 뉴스</h2>
<p>10개 분야의 최신 헤드라인 30개를 한글로 확인하세요.</p>
</div>
<span id="updatedAt" class="updated-at">뉴스를 불러오는 중...</span>
</div>
<div class="filters" aria-label="뉴스 필터">
<button class="filter-btn active" data-filter="전체">전체</button>
<button class="filter-btn" data-filter="한국">한국</button>
<button class="filter-btn" data-filter="미국">미국</button>
<button class="filter-btn" data-filter="정치">정치</button>
<button class="filter-btn" data-filter="경제">경제</button>
<button class="filter-btn" data-filter="기술">기술</button>
<button class="filter-btn" data-filter="문화">문화</button>
<button class="filter-btn" data-filter="스포츠">스포츠</button>
<button class="filter-btn" data-filter="과학">과학</button>
<button class="filter-btn" data-filter="IT">IT</button>
<button class="filter-btn" data-filter="주식">주식</button>
<button class="filter-btn" data-filter="사회">사회</button>
<button class="filter-btn" data-filter="AI">AI</button>
</div>
<div id="newsGrid" class="news-grid" aria-live="polite">
<div class="news-state">뉴스를 불러오는 중입니다.</div>
</div>
</section>

<footer>© 한미 헤드라인 · 기사 저작권은 각 언론사에 있습니다.</footer>
</div>

<script>
let newsItems=[];

function formatNewsDate(value){
 const date=new Date(value);
 if(isNaN(date.getTime())) return '';
 return new Intl.DateTimeFormat('ko-KR',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}).format(date);
}

function renderNews(filter='전체'){
 const grid=document.getElementById('newsGrid');
 const filtered=filter==='전체'
  ? newsItems
  : newsItems.filter(item=>item.country===filter||item.category===filter);
 grid.replaceChildren();
 if(!filtered.length){
  const state=document.createElement('div');
  state.className='news-state';
  state.textContent=newsItems.length?'선택한 조건의 뉴스가 없습니다.':'아직 수집된 뉴스가 없습니다. 잠시 후 다시 확인해 주세요.';
  grid.appendChild(state);
  return;
 }
 filtered.forEach(item=>{
  const article=document.createElement('article'); article.className='news-item';
  const meta=document.createElement('div'); meta.className='news-meta';
  const badge=document.createElement('span'); badge.className='badge'; badge.textContent=`${item.country} · ${item.category}`;
  const source=document.createElement('span'); source.textContent=item.source||'';
  const time=document.createElement('span'); time.textContent=formatNewsDate(item.publishedAt);
  meta.append(badge,source,time);
  const title=document.createElement('h3'); title.textContent=item.title;
  const summary=document.createElement('p'); summary.className='news-summary'; summary.textContent=item.summary||'원문에서 자세한 내용을 확인하세요.';
  const link=document.createElement('a'); link.className='news-link'; link.href=item.url; link.target='_blank'; link.rel='noopener noreferrer'; link.textContent='원문 보기 →';
  article.append(meta,title,summary,link);
  grid.appendChild(article);
 });
}

document.querySelectorAll('.filter-btn').forEach(button=>{
 button.addEventListener('click',()=>{
  document.querySelectorAll('.filter-btn').forEach(x=>x.classList.remove('active'));
  button.classList.add('active');
  renderNews(button.dataset.filter);
 });
});

fetch('./data/headlines.json',{cache:'no-store'})
 .then(response=>{if(!response.ok) throw new Error('news unavailable'); return response.json()})
 .then(data=>{
  newsItems=Array.isArray(data.items)?data.items:[];
  document.getElementById('updatedAt').textContent=data.generatedAt
   ? `업데이트 ${new Intl.DateTimeFormat('ko-KR',{dateStyle:'medium',timeStyle:'short'}).format(new Date(data.generatedAt))}`
   : '업데이트 대기 중';
  renderNews();
 })
 .catch(()=>{
  document.getElementById('updatedAt').textContent='업데이트 대기 중';
  document.getElementById('newsGrid').innerHTML='<div class="news-state">뉴스 데이터를 불러오지 못했습니다.</div>';
 });
</script>
</body>
</html>
